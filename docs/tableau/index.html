<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tableau de bord · Application de Gestion Hôtellerie IA</title>
<style>
:root{--bg:#fff;--t1:#1A1A1A;--t3:#8A8A8A;--bd:#E4E4E4;--f2:#F0F0F0;--font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--t1:#EDEDED;--bd:#333;--f2:#262626}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--t1);font-family:var(--font)}
#app{min-height:100%;padding:16px;box-sizing:border-box;display:flex;flex-direction:column}
.bar{font-size:12px;color:var(--t3);padding:4px 0 14px}.bar span{cursor:pointer}
.grid{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.t{border:1px solid var(--bd);border-radius:10px;padding:18px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;min-height:150px}
.t:active{background:var(--f2)}.t h2{margin:0;font-size:20px;font-weight:500}.t p{margin:0;font-size:14px;color:var(--t3)}
.d{border:1px solid var(--bd);border-radius:10px;padding:18px;flex:1}.d h2{margin:0 0 14px;font-weight:500}
.r{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--bd);font-size:15px}.r span:last-child{color:var(--t3)}
.ts{font-size:12px;color:var(--t3);margin-top:12px}
</style></head><body><div id="app"></div><script>
var S=[["Réception",["Arrivées du jour","Départs du jour","Clients sur place"]],["Hébergements",["Logements occupés","Logements libres","Logements à préparer"]],["Ménage",["Chambres à faire","Chambres faites","Agents en service"]],["Maintenance",["Interventions ouvertes","Interventions en cours","Interventions terminées"]],["Restauration",["Couverts réservés","Tables occupées","Commandes en cours"]],["Piscine et loisirs",["Personnes présentes","Température de l'eau (°C)","Animations du jour"]],["Sécurité",["Agents en poste","Alertes en cours","Rondes effectuées"]],["Accueil téléphonique et mails",["Appels en attente","Mails non lus","Demandes traitées"]]];
var cur=null,app=document.getElementById("app");
function v(){return Math.floor(Math.random()*40)}
function render(){var now=new Date().toLocaleTimeString("fr-FR");
 if(cur===null){app.innerHTML='<div class="bar">Tableau de bord · données simulées</div><div class="grid">'+S.map(function(s,i){return '<div class="t" data-i="'+i+'"><h2>'+s[0]+'</h2><p>'+s[1][0]+' : '+v()+'</p></div>'}).join("")+'</div>';
  app.querySelectorAll(".t").forEach(function(e){e.onclick=function(){cur=+e.dataset.i;render()}})}
 else{var s=S[cur];app.innerHTML='<div class="bar"><span id="back">Tableau de bord</span> › '+s[0]+'</div><div class="d"><h2>'+s[0]+'</h2>'+s[1].map(function(k){return '<div class="r"><span>'+k+'</span><span>'+v()+'</span></div>'}).join("")+'<div class="ts">Mis à jour à '+now+' · données simulées</div></div>';
  document.getElementById("back").onclick=function(){cur=null;render()}}}
render();setInterval(render,5000);
</script></body></html>
