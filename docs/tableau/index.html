<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tableau de bord · Application de Gestion Hôtellerie IA</title>
<style>
:root{--bg:#fff;--t1:#1A1A1A;--t3:#8A8A8A;--bd:#E4E4E4;--f2:#F0F0F0;--font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--t1:#EDEDED;--bd:#333;--f2:#262626}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--t1);font-family:var(--font)}
#app{min-height:100%;padding:16px;box-sizing:border-box;display:flex;flex-direction:column}
.bar{font-size:12px;color:var(--t3);padding:4px 0 14px}.bar span{cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;align-content:start}
.t{border:1px solid var(--bd);border-radius:10px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;min-height:96px}
.t:active{background:var(--f2)}.t h2{margin:0;font-size:16px;font-weight:500}.t p{margin:0;font-size:13px;color:var(--t3)}
.d{border:1px solid var(--bd);border-radius:10px;padding:18px;flex:1}.d h2{margin:0 0 14px;font-weight:500}
.r{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--bd);font-size:15px}.r span:last-child{color:var(--t3)}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.btn{border:1px solid var(--bd);border-radius:8px;padding:10px 14px;font-size:15px;cursor:pointer;user-select:none;background:transparent;color:var(--t1);font-family:var(--font)}.btn:active{background:var(--f2)}.plw{overflow-x:auto}.pl{border-collapse:collapse;width:100%;min-width:620px;table-layout:fixed;font-variant-numeric:tabular-nums}.pl th,.pl td{height:44px;padding:4px 1px;border-bottom:1px solid #EFEFEF;text-align:left}.pl .lg{position:sticky;left:0;background:var(--bg);font-size:13px;font-weight:500;color:var(--t1);padding:0 10px 0 0;z-index:1}.pl .dh{font-size:12px;font-weight:500;color:var(--t3);padding:8px 4px;border-bottom:1px solid var(--bd)}.pl .dh.td{color:var(--t1);font-weight:600;border-bottom:2px solid var(--t1)}.pl td.td{background:rgba(0,0,0,.025)}.oc{font-size:11px;font-weight:400;color:var(--t3)}.bar2{background:#E9E9E9;color:#1A1A1A;border-radius:6px;padding:8px 10px;margin:0 1px;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ts{font-size:12px;color:var(--t3);margin-top:12px}
</style></head><body><div id="app"></div><script>
var S=[["Planning des réservations",["Arrivées du jour","Départs du jour","Taux d'occupation (%)"]],["Hébergements",["Logements occupés","Logements libres","Logements à préparer"]],["Ménage",["Chambres à faire","Chambres faites","Agents en service"]],["Maintenance",["Interventions ouvertes","Interventions en cours","Interventions terminées"]],["Restauration",["Couverts réservés","Tables occupées","Commandes en cours"]],["Piscine et loisirs",["Personnes présentes","Température de l'eau (°C)","Animations du jour"]],["Sécurité",["Agents en poste","Alertes en cours","Rondes effectuées"]],["Accueil téléphonique et mails",["Appels en attente","Mails non lus","Demandes traitées"]],["RH",["Salariés présents","Absences du jour","Postes à pourvoir"]],["Législation",["Contrôles à venir","Documents à renouveler","Points de conformité à traiter"]]];
var cur=null,app=document.getElementById("app");
function v(){return Math.floor(Math.random()*40)}
function render(){var now=new Date().toLocaleTimeString("fr-FR");
 if(cur===null){app.innerHTML='<div class="bar">Tableau de bord · données simulées</div><div class="grid">'+S.map(function(s,i){return '<div class="t" data-i="'+i+'"><h2>'+s[0]+'</h2><p>'+s[1][0]+' : '+v()+'</p></div>'}).join("")+'</div>';
  app.querySelectorAll(".t").forEach(function(e){e.onclick=function(){go(+e.dataset.i)}})}
 else{var s=S[cur];app.innerHTML='<div class="bar"><span id="back">Tableau de bord</span> › '+s[0]+'</div><div class="nav"><button class="btn" id="ret">‹ Retour</button><span><button class="btn" id="prev">‹</button> <button class="btn" id="next">›</button></span></div><div class="d"><h2>'+s[0]+'</h2>'+(s[0]==="Planning des réservations"?planning():s[1].map(function(k){return '<div class="r"><span>'+k+'</span><span>'+v()+'</span></div>'}).join(""))+'<div class="ts">Mis à jour à '+now+' · données simulées</div></div>';
  document.getElementById("back").onclick=document.getElementById("ret").onclick=function(){go(null)};document.getElementById("prev").onclick=function(){go((cur+S.length-1)%S.length)};document.getElementById("next").onclick=function(){go((cur+1)%S.length)}}}

var PL=null;function planning(){var D=7,i,j,days=[],t=new Date();for(i=0;i<D;i++){var d=new Date(t);d.setDate(t.getDate()+i);days.push(d.toLocaleDateString("fr-FR",{weekday:"short",day:"numeric"}))}
 if(!PL){var N=["Martin","Bernard","Dubois","Leroy","Moreau","Simon","Laurent","Michel","Garcia","Roux","Fournier","Girard"],R=["Chambre 101","Chambre 102","Chambre 103","Chambre 201","Chambre 202","Mobil-home 1","Mobil-home 2","Emplacement 12"];PL=R.map(function(r){var c=[],k=0;while(k<D){if(Math.random()<.3){c.push(["",1]);k++}else{var l=Math.min(1+Math.floor(Math.random()*4),D-k);c.push([N[Math.floor(Math.random()*N.length)],l]);k+=l}}return[r,c]})}
 var occ=[];for(i=0;i<D;i++)occ.push(0);PL.forEach(function(r){var k=0;r[1].forEach(function(g){for(j=0;j<g[1];j++){if(g[0])occ[k]++;k++}})});
 var h='<div class="plw"><table class="pl"><colgroup><col style="width:140px">'+days.map(function(){return '<col>'}).join("")+'</colgroup><tr><th class="lg"></th>'+days.map(function(d,i){return '<th class="dh'+(i===0?' td':'')+'">'+d+'<div class="oc">'+Math.round(occ[i]*100/PL.length)+' %</div></th>'}).join("")+'</tr>';
 PL.forEach(function(r){var k=0;h+='<tr><th class="lg">'+r[0]+'</th>';r[1].forEach(function(g){var tc=k===0?' td':'';h+=g[0]?'<td colspan="'+g[1]+'" class="'+tc+'"><div class="bar2">'+g[0]+'</div></td>':'<td class="'+tc+'"></td>';k+=g[1]});h+='</tr>'});
 return h+'</table></div>'}
function go(i){location.hash=i===null?"":"#"+i}
function fromHash(){var i=parseInt(location.hash.slice(1),10);cur=(i>=0&&i<S.length)?i:null;render()}
window.addEventListener("hashchange",fromHash);
fromHash();setInterval(render,5000);
</script></body></html>
